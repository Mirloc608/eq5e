<section class="eq-director-heatmap">
  <header><h2>Region Danger Heatmap</h2></header>

  {{#each regions as |r id|}}
    <div class="eq-heat-row">
      <span class="eq-label">{{r.label}}</span>
      <div class="eq-bar"><div class="eq-fill" style="width: {{r.danger}}0%;"></div></div>
      <span class="eq-value">{{r.danger}}</span>
    </div>
  {{/each}}
</section>
