<section class="class-section necromancer-shadows">
  <h3>Shadows</h3>

  <div class="class-grid">
    {{#each system.class.shadows as |shadow key|}}
    <div class="class-entry" data-shadow="{{key}}">
      <div class="entry-header">
        <span class="entry-name">{{shadow.label}}</span>
      </div>

      <div class="entry-body">
        <textarea name="system.class.shadows.{{key}}.description"
                  rows="3">{{shadow.description}}</textarea>
      </div>
    </div>
    {{/each}}
  </div>
</section>
