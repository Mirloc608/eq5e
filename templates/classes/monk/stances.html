<section class="class-section monk-stances">
  <h3>Stances</h3>

  <div class="class-grid">
    {{#each system.class.stances as |stance key|}}
    <div class="class-entry" data-stance="{{key}}">
      <div class="entry-header">
        <span class="entry-name">{{stance.label}}</span>
      </div>

      <div class="entry-body">
        <textarea name="system.class.stances.{{key}}.description"
                  rows="3">{{stance.description}}</textarea>
      </div>
    </div>
    {{/each}}
  </div>
</section>
