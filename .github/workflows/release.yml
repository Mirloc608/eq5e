name: Build Release ZIP

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y sqlite3 zip

      - name: Validate JSON files
        run: |
          node -e "const fs=require('fs'),path=require('path');function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const p=path.join(d,e.name);return e.isDirectory()?walk(p):p});}const files=walk(process.cwd()).filter(f=>f.endsWith('.json'));let bad=0;for(const f of files){try{let s=fs.readFileSync(f,'utf8'); if(s.charCodeAt(0)===0xFEFF) s=s.slice(1); const last=s.lastIndexOf('}'); if(last!==-1 && last<s.length-1) s=s.slice(0,last+1); JSON.parse(s); console.log('OK',f);}catch(e){bad++; console.error('INVALID',f,e.message);} } if(bad){ console.error('Invalid JSON files found'); exit(1);} console.log('All JSON valid');"

      - name: Ensure styles exist
        run: |
          SYS=system.json
          jq -r '.styles[]' $SYS | while read -r s; do
            dir=$(dirname "$s")
            mkdir -p "$dir"
            if [ ! -f "$s" ]; then
              echo "/* placeholder $s */" > "$s"
            fi
          done
          ls -la styles || true

      - name: Create empty compendium DBs
        run: |
          mkdir -p packs
          for name in classes items npcs races spells; do
            db="packs/${name}.db"
            if [ -f "$db" ] && [ -s "$db" ]; then
              echo "$db exists and non-empty"
            else
              sqlite3 "$db" "CREATE TABLE IF NOT EXISTS documents (id TEXT PRIMARY KEY, document TEXT); CREATE INDEX IF NOT EXISTS idx_documents_id ON documents(id); VACUUM;"
            fi
          done
          ls -la packs

      - name: Build ZIP
        run: |
          rm -f dist/eq5e.zip || true
          mkdir -p dist
          zip -r dist/eq5e.zip . -x '.git/*' 'dist/*' 'node_modules/*' || true
          ls -la dist

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/eq5e.zip
          asset_name: eq5e.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
