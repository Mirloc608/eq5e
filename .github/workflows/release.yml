name: Release Module

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Determine tag and release name
        id: tag
        run: |
          echo "ref=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "name=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create zip from git archive
        run: |
          TAG="${{ steps.tag.outputs.ref }}"
          ZIPNAME="eq5e-${TAG}.zip"
          git archive --format=zip --output="${ZIPNAME}" "${TAG}"
          echo "zip=${ZIPNAME}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.ref }}
          release_name: ${{ steps.tag.outputs.name }}
          body: |
            Automated release generated by workflow.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.tag.outputs.zip }}
          asset_name: ${{ steps.tag.outputs.zip }}
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
